name: Loto7 Walkforward Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run walkforward analysis
        run: python walkforward.py

      - name: Save analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loto7-walkforward-results
          path: results/
          if-no-files-found: warn
          retention-days: 90
