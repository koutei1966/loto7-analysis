name: Loto7 Walkforward Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download and validate draw history
        run: |
          python - <<'PY'
          import csv
          import json
          import urllib.request

          url = "https://raw.githubusercontent.com/tk030-lotto/lotto-data-hub/main/data/loto7.json"
          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.load(response)

          records = {}
          for item in data:
              r = int(item["round"])
              nums = sorted(int(n) for n in item["numbers"])
              if len(nums) != 7 or len(set(nums)) != 7 or not all(1 <= n <= 37 for n in nums):
                  raise ValueError(f"Invalid draw {r}")
              if r in records:
                  raise ValueError(f"Duplicate draw {r}")
              records[r] = nums

          rounds = sorted(records)
          if len(rounds) < 700 or rounds != list(range(1, max(rounds) + 1)):
              raise ValueError("Incomplete draw history")
          if records[700] != [2, 3, 8, 12, 21, 25, 26]:
              raise ValueError("Draw 700 cross-check failed")

          with open("draws.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.writer(f)
              writer.writerow([f"n{i}" for i in range(1, 8)])
              writer.writerows(records[r] for r in rounds)

          print(f"Validated {len(rounds)} draws, through round {rounds[-1]}")
          PY

      - name: Run walkforward analysis
        run: |
          python walkforward.py
          python walkforward_v3.py
          python walkforward_v4.py

      - name: Save analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loto7-walkforward-results
          path: |
            draws.csv
            results/
          if-no-files-found: warn
          retention-days: 90
